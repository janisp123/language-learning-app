name: Publish language app website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audio/**'
      - 'content/**'
      - 'core/**'
      - 'web/**'
      - 'tools/**'
      - 'package.json'
      - 'docs/discovery-preview/**'
      - 'docs/delivery/**'
      - '.github/workflows/landing-pages.yml'

permissions:
  contents: read

concurrency:
  group: language-landing-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Read owner-enabled Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Stage the landing page and browser test build only
        run: python tools/build_site.py --output dist/landing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/landing
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved landing page
        id: deployment
        uses: actions/deploy-pages@v4
