name: Publish language app website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audio/**'
      - 'content/**'
      - 'core/**'
      - 'web/**'
      - 'tools/**'
      - 'package.json'
      - 'docs/discovery-preview/**'
      - 'docs/delivery/**'
      - '.github/workflows/landing-pages.yml'

permissions:
  contents: read

concurrency:
  group: language-landing-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Read owner-enabled Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Stage the landing page and browser test build only
        run: python tools/build_site.py --output dist/landing
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/landing
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved landing page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
