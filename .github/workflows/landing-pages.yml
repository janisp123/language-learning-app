name: Publish language app website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audio/**'
      - 'content/**'
      - 'core/**'
      - 'web/**'
      - 'tools/**'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/browser-checks.yml'
      - 'docs/discovery-preview/**'
      - 'docs/delivery/**'
      - '.github/workflows/landing-pages.yml'

permissions:
  contents: read

concurrency:
  group: language-landing-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real-browser regression test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm test
        env:
          REQUIRE_COMPLETION_BROWSER: '1'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Read owner-enabled Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Stage the landing page and browser test build only
        run: |
          python tools/build_browser.py --output dist/rebuilt.html
          cmp dist/language-learning-test.html dist/rebuilt.html
          python tools/build_site.py --output dist/landing --tested-app dist/language-learning-test.html
          cmp dist/language-learning-test.html dist/landing/learn/index.html
          cmp dist/language-learning-test.html dist/landing/language-learning-test.html
          sha256sum dist/language-learning-test.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/landing
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved landing page
        id: deployment
        uses: actions/deploy-pages@v4
