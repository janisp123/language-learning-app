name: Publish approved language landing page

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-landing-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Read owner-enabled Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Stage only the approved landing page
        run: |
          mkdir -p dist/landing
          cp docs/discovery-preview/index.html dist/landing/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/landing
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved landing page
        id: deployment
        uses: actions/deploy-pages@v4
