name: Browser test build checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real-browser regression test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm test
        env:
          REQUIRE_COMPLETION_BROWSER: '1'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify tested build is reproducible from canonical sources
        run: |
          python tools/build_browser.py --output dist/rebuilt.html
          cmp dist/language-learning-test.html dist/rebuilt.html
          sha256sum dist/language-learning-test.html
      - uses: actions/upload-artifact@v4
        with:
          name: language-learning-test
          path: dist/language-learning-test.html
