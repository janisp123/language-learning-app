<!doctype html>
<html lang="<!--DEFAULT-LANGUAGE-->" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta id="app-version" name="application-version" content="<!--APP-VERSION-->">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="theme-color" name="theme-color" content="#14261f">
  <script>
  (function () {
    const handoff = /^#theme=(dark|light)$/.exec(globalThis.location?.hash || '');
    document.documentElement.dataset.theme = handoff ? handoff[1] : 'dark';
    if (handoff) globalThis.history.replaceState(null, '', globalThis.location.pathname + globalThis.location.search);
  })();
  </script>
  <title><!--TITLE--></title>
  <!--STYLE-->
</head>
<body>
  <a id="skip" class="skip" href="#main"><!--TEXT:skip--></a>
  <header class="header"><span class="brand"><span aria-hidden="true">↔</span> <span id="brand-name"><!--TEXT:brand-name--></span></span><div class="header-tools"><span id="badge" class="badge"><!--TEXT:badge--></span><button id="learning-theme-toggle" class="learning-theme-toggle" type="button" aria-pressed="true">☀</button></div></header>
  <main id="main" tabindex="-1">
    <p id="draft" class="draft"><!--TEXT:draft--></p>
    <p id="error" class="error" role="alert" hidden></p>
    <section id="setup" aria-labelledby="welcome">
      <p id="audience" class="eyebrow"><!--TEXT:audience--></p>
      <h1 id="welcome"><!--TEXT:welcome--></h1>
      <p id="intro" class="lead"><!--TEXT:intro--></p>
      <label id="direction-caption" for="direction"><!--TEXT:direction-caption--></label>
      <select id="direction"><!--DIRECTIONS--></select>
      <div id="focused-controls">
        <label id="course-caption" for="course-selection"><!--TEXT:course-caption--></label>
        <select id="course-selection"><option id="course-kids" value="kids" selected><!--TEXT:course-kids--></option><option id="course-adults" value="adults"><!--TEXT:course-adults--></option><option id="course-full" value="full"><!--TEXT:course-full--></option></select>
      </div>
      <button class="primary start" id="start" type="button"><!--TEXT:start--></button>
      <div class="rules"><h2 id="rules-title"><!--TEXT:rules-title--></h2><ul><li id="rule-options"><!--TEXT:rule-options--></li><li id="rule-complete"><!--TEXT:rule-complete--></li><li id="rule-mistakes"><!--TEXT:rule-mistakes--></li><li id="rule-reset"><!--TEXT:rule-reset--></li></ul></div>
      <details class="course-outline"><summary id="outline-summary"><!--TEXT:outline-summary--></summary><ol id="lesson-list"></ol><p id="outline-note" class="small"><!--TEXT:outline-note--></p></details>
    </section>
    <section id="practice" aria-labelledby="lesson-title" hidden>
      <div class="lesson-top"><p class="eyebrow" id="lesson-label"></p><span id="direction-label" class="small"></span></div>
      <h1 id="lesson-title"></h1>
      <div class="progress-row"><label for="progress" id="progress-label"></label><progress id="progress" max="10" value="0"></progress></div>
      <p class="small" id="mistakes"></p>
      <article class="question-card" aria-labelledby="question">
        <div class="question-tools"><p id="instruction" class="eyebrow"></p><button id="report-open" class="quiet question-report" type="button" aria-haspopup="dialog" aria-controls="report-dialog"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M5 21V3m0 1c5-4 9 4 14 0v10c-5 4-9-4-14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button></div>
        <div class="question-prompt">
          <h2 id="question" tabindex="-1"></h2>
          <button id="question-replay" class="question-replay" type="button" hidden disabled>
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4V5Z" fill="currentColor"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <p id="question-audio-error" class="small prompt-audio-error" role="status" aria-live="polite"></p>
        <audio id="audio-media" preload="none"></audio>
        <div id="choices" class="choices"></div>
      </article>
      <div id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"></div>
      <p id="correction-status" class="small" role="status" aria-live="polite"></p>
      <div class="practice-actions"><button id="restart" class="quiet" type="button"><!--TEXT:restart--></button><button id="change" class="quiet" type="button"><!--TEXT:change--></button></div>
      <p id="help" class="small help"><!--TEXT:help--></p>
    </section>
    <section id="finished" aria-labelledby="finished-title" hidden>
      <p id="finished-caption" class="eyebrow"><!--TEXT:finished-caption--></p><h1 id="finished-title" tabindex="-1"><!--TEXT:finished-title--></h1><p id="finished-intro" class="lead"><!--TEXT:finished-intro--></p><button id="again" class="primary" type="button"><!--TEXT:again--></button><button id="choose" class="quiet" type="button"><!--TEXT:choose--></button>
    </section>
    <noscript><!--NOSCRIPT--></noscript>
  </main>
  <footer><p>Made by <a href="https://github.com/janisp123">Janis Paegle</a> 2026</p><p id="footer-caption"><!--TEXT:footer-caption--></p><a id="source-link" href="https://github.com/janisp123/language-learning-app"><!--TEXT:source-link--></a><p id="privacy-note" class="small"><!--TEXT:privacy-note--></p></footer>
  <dialog id="report-dialog" class="report-dialog" aria-labelledby="report-title">
    <div class="report-heading"><h2 id="report-title"><!--TEXT:report-title--></h2><button id="report-close" class="quiet" type="button"><!--TEXT:report-close--></button></div>
    <p id="report-note" class="small"><!--TEXT:report-note--></p>
    <label id="report-type-label" for="report-type"><!--TEXT:report-type-label--></label>
    <select id="report-type"><option id="report-type-question" value="question"><!--TEXT:report-type-question--></option><option id="report-type-answer" value="answer"><!--TEXT:report-type-answer--></option></select>
    <div id="report-answer-field" hidden><label id="report-answer-label" for="report-answer"><!--TEXT:report-answer-label--></label><select id="report-answer"></select></div>
    <label id="report-original-label" for="report-original"><!--TEXT:report-original-label--></label><textarea id="report-original" rows="2" readonly></textarea>
    <label id="report-proposal-label" for="report-proposal"><!--TEXT:report-proposal-label--></label><textarea id="report-proposal" rows="3" maxlength="2000"></textarea>
    <details><summary id="report-details-title"><!--TEXT:report-details-title--></summary><pre id="report-context"></pre></details>
    <button id="report-copy" class="primary" type="button" disabled><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><rect x="8" y="8" width="12" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 5V3H3v13h2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span id="report-copy-label"><!--TEXT:report-copy-label--></span></button>
    <p id="report-status" class="small" role="status" aria-live="polite"></p>
    <div id="report-manual" hidden><label id="report-manual-label" for="report-output"><!--TEXT:report-manual-label--></label><textarea id="report-output" readonly rows="8"></textarea></div>
  </dialog>
  <script type="application/json" id="focused-data"><!--FOCUSED--></script>
  <script type="application/json" id="course-data"><!--COURSE--></script>
  <script type="application/json" id="ui-data"><!--UI--></script>
  <script type="application/json" id="audio-data"><!--AUDIO-DATA--></script>
  <!--ENGINE-->
  <!--AUDIO-MODULES-->
  <!--REPORT-MODULE-->
  <!--APP-->
</body>
</html>
